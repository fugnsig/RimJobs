name: Release

# Build the portable Windows .exe and publish it as a GitHub Release asset
# whenever a version tag (e.g. v1.3.37) is pushed.
#
#   git tag v1.3.37
#   git push origin v1.3.37
#
# The .exe is attached to the release, not committed to the repo.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RimJobs.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
